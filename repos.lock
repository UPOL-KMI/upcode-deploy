# repos.lock -- the source revisions this deployment is verified against.
#
# Why this file exists: `pull-repos.sh` used to fetch every repository's default branch, which is a
# moving target. A stack that worked last week could stop working after a `git pull` nobody thought
# of as a change, and there was nowhere to look up what had been working. This is that place.
#
# Read by `pull-repos.sh`. Precedence, highest first:
#
#   1. a per-repo environment variable   API_REF=upcode ./pull-repos.sh
#   2. the global REF variable           REF=master ./pull-repos.sh
#   3. this file
#   4. the repository's default branch
#
# Run `NO_LOCK=1 ./pull-repos.sh` to ignore it entirely and take the default branches.
#
# **Commits, not branches, and deliberately.** A branch name would put this file back in the
# business of tracking a moving target. For day-to-day work on a fork, pass the branch yourself
# (`ISOLATE_REF=upcode ./pull-repos.sh`); when a change is verified, bump the commit here and say
# what was verified in COMPATIBILITY.md.

# **Where our commits go.** On every fork of an upstream ReCodEx repository -- api, worker, isolate
# -- our work lives on a branch called `upcode`, and `master` is left as the upstream mirror so it
# can keep being pulled. `web-next` is the exception and not an inconsistency: it is our own
# repository with no upstream at all, so it has no `master` to diverge from and its branch is
# `main`. `broker`, `monitor` and `cleaner` are forks we have not had to change yet and so have no
# `upcode` branch -- **make one before committing to them.** They are checked out here on a local
# branch called `pinned`, which `pull-repos.sh` force-resets on every run: a commit left there is
# lost at the next pull, silently.
#
# Both `api` and `web-next` are pinned to the branch tips that were built and run for the
# verification recorded in COMPATIBILITY.md.

api        383b90840fc09b8a82cc0070432725306de7e96a   # UPOL-KMI/upcode-api, tip of `upcode`
worker     cf26d8ce817abcf473abd52d0d76e0f548027502   # UPOL-KMI/upcode-worker, tip of `upcode`
broker     abdc95cfad4586a9cd2f17bdd5fdaa48cc60445d   # UPOL-KMI/upcode-broker
monitor    e6f8a1dd25c5837c0aef5019b91e5987bfc15c85   # UPOL-KMI/upcode-monitor
isolate    bfdcf98ea7be96eb590d6fb1c3bc312d912208b3   # UPOL-KMI/upcode-isolate, tip of `upcode`
cleaner    0a5e390241866fac52755098fc2cb3882e106e83   # UPOL-KMI/upcode-cleaner
web-next   9f02c0bae23b6edee102b294823ed92ed320c5e3   # UPOL-KMI/upcode-web-ui, tip of `main`

# **The legacy frontend is gone**, as of the round that removed it: it was a second complete
# frontend talking to the same API with the same rights, on a published port nobody watched, and its
# only remaining value -- a side-by-side reference during the cutover -- ended when the cutover did.
# It is no longer built, no longer cloned and no longer pinned here.
